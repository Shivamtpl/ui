<div class="page">

<h1>User Management</h1>

<input
type="text"
placeholder="Search users..."
[(ngModel)]="search"
(input)="searchUsers()">

<table>

<thead>

<tr>

<th>ID</th>

<th>Name</th>

<th>Email</th>

<th>Role</th>

<th>Action</th>

</tr>

</thead>

<tbody>

<tr *ngFor="let user of filteredUsers">

<td>{{user.id}}</td>

<td>{{user.name}}</td>

<td>{{user.email}}</td>

<td>{{user.role}}</td>

<td>

<button
class="delete-btn"
(click)="delete(user.id)">

Delete

</button>

</td>

</tr>

</tbody>

</table>

</div>
