<button
  class="my-rooms-btn"
  (click)="goToMyRooms()">

  🏠 My Rooms

</button>

<div class="form-group">
    <label>Latitude</label>
    <input
        type="number"
        step="any"
        [(ngModel)]="latitude"
        name="latitude"
        placeholder="Enter Latitude">
</div>

<div class="form-group">
    <label>Longitude</label>
    <input
        type="number"
        step="any"
        [(ngModel)]="longitude"
        name="longitude"
        placeholder="Enter Longitude">
</div>
